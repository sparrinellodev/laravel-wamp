name: Bug Report
description: Report a bug in Hermod
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the form with as much detail as possible.

  - type: input
    id: laravel-wamp-version
    attributes:
      label: Laravel-WAMP version
      placeholder: "e.g. 2.0.0"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "e.g. 8.2.0"
    validations:
      required: true

  - type: input
    id: laravel-version
    attributes:
      label: Laravel version
      placeholder: "e.g. 12.0.0"
    validations:
      required: true

  - type: input
    id: router
    attributes:
      label: WAMP router
      placeholder: "e.g. Crossbar.io 23.x"
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How to reproduce the behavior.
      placeholder: |
        1. Configure Hermod with...
        2. Run...
        3. See the error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen instead?
    validations:
      required: true

  - type: textarea
    id: stacktrace
    attributes:
      label: Stack trace / Logs
      description: If available, paste the stack trace here.
      render: shell
    validations:
      required: false
