name: Feature Request
description: Propose a new feature
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve Hermod? Tell us about it!

  - type: textarea
    id: problem
    attributes:
      label: The problem you want to solve
      description: Clearly describe the problem or the current limitation.
      placeholder: "Currently it is not possible to..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered other solutions?
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which area does this feature affect?
      options:
        - "RPC (Caller / Callee)"
        - "PubSub (Publisher / Subscriber)"
        - "Authentication & reconnect"
        - "Serializers"
        - "Transports (WebSocket / RawSocket)"
        - "Laravel integration"
        - "Other"
    validations:
      required: false
